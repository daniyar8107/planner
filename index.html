<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Задачи">
<title>Задачи студента</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one centered column, bottom navigation with six sections */
:root{
  --bg:#eef2f4;
  --surface:#ffffff;
  --ink:#16222a;
  --muted:#5d6d77;
  --line:#d9e1e5;
  --accent:#0f766e;
  --accent-ink:#ffffff;
  --danger:#c2410c;
  --font-display:"Unbounded","Onest",system-ui,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e171c;--surface:#16232a;--ink:#e6eef2;--muted:#93a5af;--line:#26353d;
    --accent:#2dd4bf;--accent-ink:#06211e;--danger:#fb923c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e171c;--surface:#16232a;--ink:#e6eef2;--muted:#93a5af;--line:#26353d;
  --accent:#2dd4bf;--accent-ink:#06211e;--danger:#fb923c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(92px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-family:var(--font-display);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.date{color:var(--muted);font-size:14px}
.langs{display:flex;gap:4px;flex:none}
.lang,.tool{min-width:44px;min-height:36px;padding:4px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.lang[aria-pressed=true],.tool[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.summary-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.summary-row b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
form,.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
form.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select,button,textarea{font:inherit;color:inherit}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=email],input[type=password],select{
  width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)
}
textarea{width:100%;min-height:84px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
input:focus-visible,select:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{min-height:44px;padding:9px 16px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.mini{min-height:40px;min-width:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.mini:hover{border-color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{flex:none;min-height:36px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section.group{display:flex;flex-direction:column;gap:8px}
.group h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.group h2 span{font-variant-numeric:tabular-nums;font-weight:500}
.group.overdue h2{color:var(--danger)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li.task{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sub,var(--line));border-radius:12px;padding:10px 8px 10px 12px;display:flex;gap:12px;align-items:center}
li.task.p-high{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--danger) 55%,transparent)}
li.task.editing{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.check{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.check svg{width:16px;height:16px;opacity:0}
li.done .check{background:var(--accent);border-color:var(--accent)}
li.done .check svg{opacity:1;stroke:var(--accent-ink)}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.title{overflow-wrap:anywhere}
li.done .title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta .sub{color:var(--ink);font-weight:500}
.meta .late{color:var(--danger);font-weight:600}
.meta .hi{color:var(--danger);font-weight:600}
.iconbtn{flex:none;width:40px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.iconbtn:hover{background:var(--bg);color:var(--ink)}
.iconbtn.del:hover{color:var(--danger)}
.empty{color:var(--muted);text-align:center;padding:28px 8px;border:1px dashed var(--line);border-radius:12px}
footer{color:var(--muted);font-size:12px;text-align:center}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;padding:6px}
[hidden]{display:none!important}
.view{display:flex;flex-direction:column;gap:18px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day h2{margin:0;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.day h2 em{font-style:normal;font-size:12px;color:var(--accent);font-weight:600}
.cls{display:grid;grid-template-columns:92px 1fr;gap:10px;padding-top:8px;border-top:1px solid var(--line)}
.cls:first-of-type{border-top:0;padding-top:0}
.cls time{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;line-height:1.35}
.cls .cn{font-weight:500;overflow-wrap:anywhere}
.cls .cm{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.none{color:var(--muted);font-size:14px}
.src{color:var(--muted);font-size:13px}
.subjgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subjcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--sub);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:92px}
.subjcard:hover{border-color:var(--accent)}
.subjcard b{font-weight:600;overflow-wrap:anywhere}
.subjcard span{font-size:12px;color:var(--muted)}
.backbtn{align-self:flex-start;min-height:40px;padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.subjhead{border-left:5px solid var(--sub);padding-left:12px}
.subjhead h2{margin:0;font-family:var(--font-display);font-size:18px;font-weight:600;text-wrap:balance}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel>h3,.card>h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.note{display:flex;flex-direction:column;gap:6px}
.note .nf{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.file{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.file:first-of-type{border-top:0}
.file .fn{flex:1;min-width:0;overflow-wrap:anywhere}
.file .fs{font-size:12px;color:var(--muted)}
/* habits */
.habit{--hc:var(--accent);background:color-mix(in srgb,var(--hc) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--hc) 40%,var(--line));border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.hh{display:flex;align-items:center;gap:10px}
.hico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--hc) 22%,var(--surface))}
.hn{flex:1;min-width:0}
.hn b{font-weight:600;overflow-wrap:anywhere}
.hn div{font-size:13px;color:var(--muted)}
.hcheck{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--hc);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.hcheck svg{width:22px;height:22px;opacity:0;stroke:#fff}
.hcheck[aria-pressed=true]{background:var(--hc)}
.hcheck[aria-pressed=true] svg{opacity:1}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dot{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;cursor:pointer;padding:2px 0;min-height:44px;font-size:11px;color:var(--muted)}
.dot i{width:26px;height:26px;border-radius:50%;border:2px solid color-mix(in srgb,var(--hc) 45%,var(--line));display:block}
.dot[aria-pressed=true] i{background:var(--hc);border-color:var(--hc)}
.dot.istoday{color:var(--ink);font-weight:600}
.picker{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pick{min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--bg);cursor:pointer;font-size:22px;padding:0}
.pick[aria-pressed=true]{border-color:var(--ink)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
/* stats */
.seg{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:12px}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.nav2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav2 b{font-weight:600;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--font-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.chart{display:grid;gap:3px;height:150px;align-items:stretch}
.col{display:flex;flex-direction:column;min-width:0}
.bw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-bottom:1px solid var(--line)}
.bw em{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.2}
.bw i{display:block;width:100%;max-width:34px;border-radius:4px 4px 0 0;background:var(--c,var(--accent));min-height:0}
.lab{font-size:10.5px;color:var(--muted);text-align:center;height:16px;line-height:16px;white-space:nowrap;overflow:visible}
.hrow{display:grid;grid-template-columns:1fr 44px;gap:4px 10px;align-items:center}
.hrow .hl{font-size:14px;overflow-wrap:anywhere}
.hrow .hv{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.hrow .bar{grid-column:1/-1;height:8px}
.hrow .bar i{background:var(--c,var(--accent))}
/* bottom nav */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
.navin{max-width:640px;margin:0 auto;display:flex;gap:2px}
.nv{flex:1;min-width:0;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;border-radius:10px;color:var(--muted);font-size:10.5px;cursor:pointer;padding:4px 0}
.nv svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nv[aria-current=page]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:600}
.rbar{display:none;max-width:640px;margin:0 auto 6px;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.bottom.editing .rbar{display:flex}
.rbar .btn{min-height:36px;padding:4px 14px}
.nvw{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.nvw .nv{min-height:40px;flex:none;width:100%;cursor:default}
.mv{display:flex;gap:4px}
.mv .mini{min-width:40px;padding:4px 10px}
.mv .mini:disabled{opacity:.35;cursor:default}
body:not(.authed) .wrap,body:not(.authed) .bottom{display:none}
body.authed #authView{display:none}
.authwrap{max-width:420px;margin:6vh auto 0;display:flex;flex-direction:column;gap:16px}
.authwrap .top{align-items:center}
.authform{display:flex;flex-direction:column;gap:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:90vw;text-align:center}
.loadingc{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:var(--bg);color:var(--muted)}
@media (max-width:420px){form.grid{grid-template-columns:1fr}li.task.editing{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head>
<body>
<div class="authwrap" id="authView">
  <div class="top">
    <h1 id="aTitle"></h1>
    <div class="langs" role="group" aria-label="Language">
      <button class="lang" type="button" data-lang="ru">RU</button>
      <button class="lang" type="button" data-lang="ky">KY</button>
      <button class="lang" type="button" data-lang="tr">TR</button>
    </div>
  </div>
  <form id="authForm" class="authform">
    <label for="aEmail"><span data-i="email"></span><input type="email" id="aEmail" autocomplete="email" required></label>
    <label for="aPass"><span data-i="password"></span><input type="password" id="aPass" minlength="6" autocomplete="current-password" required></label>
    <button class="btn" type="submit" id="aSubmit"></button>
    <button class="linkbtn" type="button" id="aToggle"></button>
    <div class="none" id="aMsg" role="alert"></div>
  </form>
</div>

<div class="wrap">
  <header>
    <div class="top">
      <div>
        <h1 id="h1"></h1>
        <div class="date" id="today"></div>
      </div>
      <div class="langs" role="group" aria-label="Language">
        <button class="lang" type="button" data-lang="ru">RU</button>
        <button class="lang" type="button" data-lang="ky">KY</button>
        <button class="lang" type="button" data-lang="tr">TR</button>
        <button class="tool" type="button" id="reorderBtn" aria-pressed="false">⇄</button>
        <button class="tool" type="button" id="logoutBtn">↪</button>
      </div>
    </div>
  </header>

  <div class="view" id="viewTasks">
    <div class="card" id="importBanner" hidden style="display:flex;flex-direction:column;gap:10px">
      <b id="impTitle"></b><div class="none" id="impCount"></div>
      <div class="row"><button class="btn" type="button" id="impGo"></button><button class="btn ghost" type="button" id="impSkip"></button></div>
    </div>
    <div class="summary" aria-live="polite">
      <div class="summary-row">
        <span><span data-i="sToday"></span>: <b id="sToday">0</b></span>
        <span><span data-i="sLate"></span>: <b id="sLate">0</b></span>
        <span><span data-i="sDone"></span>: <b id="sDone">0</b></span>
      </div>
      <div class="bar"><i id="bar"></i></div>
    </div>

    <form id="form" class="grid" autocomplete="off">
      <label class="full" for="fTitle"><span data-i="fWhat"></span>
        <input type="text" id="fTitle" data-ph="fWhatPh" required maxlength="200">
      </label>
      <label for="fSubject"><span data-i="fSubject"></span>
        <input type="text" id="fSubject" list="subjects" data-ph="fSubjectPh" maxlength="40">
        <datalist id="subjects"></datalist>
      </label>
      <label for="fDue"><span data-i="fDue"></span>
        <input type="date" id="fDue">
      </label>
      <label for="fPrio"><span data-i="fPrio"></span>
        <select id="fPrio">
          <option value="1" data-i="pNormal"></option>
          <option value="2" data-i="pHigh"></option>
          <option value="0" data-i="pLow"></option>
        </select>
      </label>
      <div style="display:flex;align-items:flex-end"><button class="btn" type="submit" style="width:100%" data-i="add"></button></div>
    </form>

    <div class="filters" id="filters" role="group"></div>
    <main id="list" style="display:flex;flex-direction:column;gap:20px"></main>

    <footer>
      <span data-i="footer"></span>
      <button class="linkbtn" id="reset" type="button"></button>
    </footer>
  </div>

  <div class="view" id="viewSched" hidden>
    <div id="schedList" style="display:flex;flex-direction:column;gap:12px"></div>
    <div class="src" data-i="source"></div>
  </div>

  <div class="view" id="viewSubj" hidden></div>
  <div class="view" id="viewHabits" hidden></div>
  <div class="view" id="viewStats" hidden></div>
</div>

<div class="loadingc" id="loading" hidden data-i="loading"></div>
<div id="toast" role="status" hidden></div>

<nav class="bottom" aria-label="Menu">
  <div class="rbar" id="rbar"><span id="rhint"></span><button class="btn" type="button" id="rdone"></button></div>
  <div class="navin" id="navin"></div>
</nav>

  function pad(n){return n<10?"0"+n:""+n}

  function addDays(n){return shift(todayISO(),n)}
  function dayDiff(s){return Math.round((parse(s)-parse(todayISO()))/86400000)}

  /* ---------- Задачи ---------- */
  function dueLabel(t){
    var d=dayDiff(t.due),L=T(),date=fmtDate(t.due);
    if(t.done)return date;
    if(d<0)return '<span class="late">'+date+' · '+L.lateBy.replace("{n}",-d)+'</span>';
    if(d===0)return L.today;
    if(d===1)return L.tomorrow;
    return date;
  }
  function groupOf(t){
    if(t.done)return "done";
    if(!t.due)return "none";
    var d=dayDiff(t.due);
    if(d<0)return "overdue";
    if(d===0)return "today";
    if(d===1)return "tomorrow";
    if(d<=7)return "week";
    return "later";
  }
  var ORDER=["overdue","today","tomorrow","week","later","none","done"];

  function renderTasks(){
    var L=T();
    var subs=[],all=[];
    state.tasks.forEach(function(t){var s=tSubj(t);if(s&&subs.indexOf(s)<0)subs.push(s)});
    subs.sort();
    all=subs.slice();
    COURSES.forEach(function(k){if(all.indexOf(L.courses[k])<0)all.push(L.courses[k])});
    if(state.filter&&subs.indexOf(state.filter)<0)state.filter="";
    $("subjects").innerHTML=all.map(function(s){return '<option value="'+esc(s)+'">'}).join("");

    var f=$("filters");
    f.innerHTML="";
    [""].concat(subs).forEach(function(s){
      var b=document.createElement("button");
      b.type="button";b.className="chip";
      b.textContent=s||L.all;
      b.setAttribute("aria-pressed",state.filter===s?"true":"false");
      b.onclick=function(){state.filter=s;save();renderTasks()};
      f.appendChild(b);
    });

    var shown=state.tasks.filter(function(t){return !state.filter||tSubj(t)===state.filter});
    var open=state.tasks.filter(function(t){return !t.done});
    $("sToday").textContent=open.filter(function(t){return t.due&&dayDiff(t.due)===0}).length;
    $("sLate").textContent=open.filter(function(t){return t.due&&dayDiff(t.due)<0}).length;
    var doneN=state.tasks.length-open.length;
    $("sDone").textContent=L.of.replace("{a}",doneN).replace("{b}",state.tasks.length);
    $("bar").style.width=(state.tasks.length?Math.round(doneN/state.tasks.length*100):0)+"%";

    var out="";
    ORDER.forEach(function(g){
      var items=shown.filter(function(t){return groupOf(t)===g});
      if(!items.length)return;
      items.sort(function(a,b){
        if(a.done!==b.done)return a.done?1:-1;
        if(a.due&&b.due&&a.due!==b.due)return a.due<b.due?-1:1;
        if(a.due!==b.due)return a.due?-1:1;
        return b.prio-a.prio;
      });
      out+='<section class="group '+g+'"><h2>'+esc(L.g[g])+'<span>'+items.length+'</span></h2><ul>';
      items.forEach(function(t){
        var title=nm(t,"title"),subj=tSubj(t);
        if(t.id===editId){
          out+='<li class="task editing" style="--sub:'+subColor(t)+'">'+
            '<label class="full" for="eT">'+esc(L.fWhat)+'<input type="text" id="eT" value="'+esc(title)+'" maxlength="200"></label>'+
            '<label for="eS">'+esc(L.fSubject)+'<input type="text" id="eS" list="subjects" value="'+esc(subj||"")+'" maxlength="40"></label>'+
            '<label for="eD">'+esc(L.fDue)+'<input type="date" id="eD" value="'+esc(t.due||"")+'"></label>'+
            '<label for="eP">'+esc(L.fPrio)+'<select id="eP"><option value="1"'+(t.prio===1?" selected":"")+'>'+esc(L.pNormal)+'</option><option value="2"'+(t.prio===2?" selected":"")+'>'+esc(L.pHigh)+'</option><option value="0"'+(t.prio===0?" selected":"")+'>'+esc(L.pLow)+'</option></select></label>'+
            '<div class="row"><button class="btn" type="button" data-act="save" data-id="'+t.id+'">'+esc(L.save)+'</button><button class="btn ghost" type="button" data-act="cancel">'+esc(L.cancel)+'</button></div></li>';
          return;
        }
        out+='<li class="task'+(t.done?" done":"")+(t.prio===2&&!t.done?" p-high":"")+'" style="--sub:'+subColor(t)+'">'+
          '<button class="check" type="button" data-act="toggle" data-id="'+t.id+'" role="checkbox" aria-checked="'+t.done+'" aria-label="'+esc(L.markDone+title)+'">'+
          '<svg viewBox="0 0 16 16" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg></button>'+
          '<div class="body"><div class="title">'+esc(title)+'</div><div class="meta">'+
          (subj?'<span class="sub">'+esc(subj)+'</span>':'')+
          (t.due?'<span>'+dueLabel(t)+'</span>':'')+
          (t.prio===2&&!t.done?'<span class="hi">'+esc(L.important)+'</span>':'')+
          '</div></div>'+
          '<button class="iconbtn" type="button" data-act="edit" data-id="'+t.id+'" aria-label="'+esc(L.edit+title)+'">✎</button>'+
          '<button class="iconbtn del" type="button" data-act="del" data-id="'+t.id+'" aria-label="'+esc(L.del+title)+'">×</button></li>';
      });
      out+='</ul></section>';
    });

    if(t.hasAttribute("data-hcolor")){hdraft.color=t.getAttribute("data-hcolor");renderHabits();return;}
    if(t.hasAttribute("data-hcancel")){hdraft=null;renderHabits();return;}
    if(t.hasAttribute("data-hsave")){
      var name=hdraft.name.trim();if(!name)return;
      var d=hdraft;hdraft=null;
      if(d.id){
        state.habits.forEach(function(x){if(x.id===d.id){x.name=name;x.icon=d.icon;x.color=d.color}});
        renderHabits();
        run(sb.from("habits").update({name:name,icon:d.icon,color:d.color}).eq("id",d.id)).catch(fail);
      }else{
        run(sb.from("habits").insert({name:name,icon:d.icon,color:d.color,started_on:todayISO()}).select().single()).then(function(r){
          state.habits.push({id:r.data.id,name:r.data.name,icon:r.data.icon,color:r.data.color,createdAt:r.data.started_on});
          renderHabits();
        }).catch(function(err){hdraft=d;renderHabits();fail(err)});
      }
      return;
    }
    if(t.hasAttribute("data-hdel")){
      if(!hdraft.confirm){hdraft.confirm=true;renderHabits();return;}
      var did=hdraft.id;
      state.habits=state.habits.filter(function(x){return x.id!==did});
      delete state.log[did];hdraft=null;renderHabits();
      run(sb.from("habits").delete().eq("id",did)).catch(fail);
      return;
    }
    if(t.hasAttribute("data-hday")){
      var p=t.getAttribute("data-hday").split("|"),hid=p[0],day=p[1];
      state.log[hid]=state.log[hid]||{};
      if(state.log[hid][day]){
        delete state.log[hid][day];renderHabits();
        run(sb.from("habit_logs").delete().eq("habit_id",hid).eq("day",day)).catch(fail);
      }else{
        state.log[hid][day]=1;renderHabits();
        run(sb.from("habit_logs").insert({habit_id:hid,day:day})).catch(fail);
      }
    }
  });

  /* ---------- Статистика ---------- */
  function periodDays(){
    var p=state.stat.p,o=state.stat.o,L=T(),days=[],title;
    var now=parse(todayISO());
    if(p==="week"){
      var wd=(now.getDay()+6)%7;
      var start=shift(todayISO(),-wd+o*7);
      for(var i=0;i<7;i++)days.push(shift(start,i));
      title=fmtDate(days[0])+" – "+fmtDate(days[6]);
    }else{
      var m=new Date(now.getFullYear(),now.getMonth()+o,1,12);
      var n=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
      for(var j=1;j<=n;j++)days.push(iso(new Date(m.getFullYear(),m.getMonth(),j,12)));
      title=L.monthsN[m.getMonth()]+" "+m.getFullYear();
    }
    return {days:days,title:title};
  }
  function chart(vals,labels,color,showVals,max,suffix){
    var n=vals.length,out='<div class="chart" style="grid-template-columns:repeat(%n,minmax(0,1fr))">'.replace("%n",n);
    vals.forEach(function(v,i){
      var h=v==null||max<=0?0:Math.max(v>0?3:0,v/max*100);
      var lab=labels[i];
      out+='<div class="col" title="'+esc((lab||"")+": "+(v==null?"–":fmtN(v)+(suffix||"")))+'"><div class="bw">'+
        (showVals&&v!=null&&v>0?'<em>'+fmtN(v)+'</em>':'')+
        '<i style="height:'+h+'%;--c:'+color+'"></i></div><span class="lab">'+esc(lab)+'</span></div>';
    });
    return out+'</div>';
  }

  function renderStats(){
    if(view!=="stats")return;
    var L=T(),st=state.stat,per=periodDays(),days=per.days,today=todayISO(),out="";
    var isWeek=st.p==="week";
    var labels=days.map(function(d,i){
      if(isWeek)return L.wd[parse(d).getDay()];
      var dn=parse(d).getDate();
      return (dn===1||dn%5===0)?String(dn):"";
    });

    // задачи
    var inP=function(d){return d&&days.indexOf(d)>=0};
    var doneT=state.tasks.filter(function(t){return t.done&&inP(t.doneAt)});
    var perDay=days.map(function(d){return doneT.filter(function(t){return t.doneAt===d}).length});

    // привычки
    var hPerDay=days.map(function(d){
      if(d>today)return null;
      var act=state.habits.filter(function(h){return h.createdAt<=d});
      if(!act.length)return null;
      var dn=act.filter(function(h){return logged(h.id,d)}).length;
      return dn/act.length*100;
    });
    var sumDone=0,sumAct=0;
    days.forEach(function(d){
      if(d>today)return;
      state.habits.forEach(function(h){if(h.createdAt<=d){sumAct++;if(logged(h.id,d))sumDone++}});
    });
    var hPct=sumAct?Math.round(sumDone/sumAct*100):0;
    var best=0;
    state.habits.forEach(function(h){
      var run=0;
      days.forEach(function(d){if(d<=today&&logged(h.id,d)){run++;if(run>best)best=run}else run=0});
    });

    out+='<div class="seg" role="group"><button type="button" data-p="week" aria-pressed="'+isWeek+'">'+esc(L.week)+'</button><button type="button" data-p="month" aria-pressed="'+!isWeek+'">'+esc(L.month)+'</button></div>'+
      '<div class="nav2"><button class="mini" type="button" data-o="-1" aria-label="'+esc(L.prev)+'">‹</button><b>'+esc(per.title)+'</b>'+
      '<button class="mini" type="button" data-o="1" aria-label="'+esc(L.next)+'"'+(st.o>=0?" disabled":"")+'>›</button></div>';

    out+='<div class="tiles">'+
      '<div class="tile"><b>'+doneT.length+'</b><span>'+esc(L.stTasks)+'</span></div>'+
      '<div class="tile"><b>'+hPct+'%</b><span>'+esc(L.stHabits)+'</span></div>'+
      '<div class="tile"><b>'+best+'</b><span>'+esc(L.stBest)+' ('+esc(L.stDays)+')</span></div></div>';

    var maxT=Math.max.apply(null,perDay.concat([1]));
    out+='<div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>'+esc(L.chTasks)+'</h3>'+
      chart(perDay,labels,"var(--accent)",isWeek,maxT,"")+'</div>';

    out+='<div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>'+esc(L.chHabits)+'</h3>'+
      chart(hPerDay,labels,"#2563eb",false,100,"%")+'</div>';

    out+='<div class="card" style="display:flex;flex-direction:column;gap:12px"><h3>'+esc(L.chEach)+'</h3>';
    if(!state.habits.length)out+='<div class="none">'+esc(L.noData)+'</div>';
    state.habits.forEach(function(h){
      var act=0,dn=0;
      days.forEach(function(d){if(d<=today&&h.createdAt<=d){act++;if(logged(h.id,d))dn++}});
      var p=act?Math.round(dn/act*100):0;
      out+='<div class="hrow" style="--c:'+esc(h.color)+'"><div class="hl">'+esc(h.icon)+' '+esc(nm(h,"name"))+' <span style="color:var(--muted);font-size:12px">'+dn+'/'+act+'</span></div><div class="hv">'+p+'%</div><div class="bar"><i style="width:'+p+'%"></i></div></div>';
    });
    out+='</div>';

    var bySubj={};
    doneT.forEach(function(t){var s=tSubj(t)||"—";bySubj[s]=(bySubj[s]||0)+1});
    var keys=Object.keys(bySubj).sort(function(a,b){return bySubj[b]-bySubj[a]});
    out+='<div class="card" style="display:flex;flex-direction:column;gap:12px"><h3>'+esc(L.chSubj)+'</h3>';
    if(!keys.length)out+='<div class="none">'+esc(L.noData)+'</div>';
    var mx=keys.length?bySubj[keys[0]]:1;
    keys.forEach(function(k){
      out+='<div class="hrow" style="--c:'+courseColor(k)+'"><div class="hl">'+esc(k)+'</div><div class="hv">'+bySubj[k]+'</div><div class="bar"><i style="width:'+Math.round(bySubj[k]/mx*100)+'%"></i></div></div>';
    });
    out+='</div>';
    $("viewStats").innerHTML=out;
  }
  $("viewStats").addEventListener("click",function(e){
    var t=e.target.closest("button");if(!t||t.disabled)return;
    if(t.hasAttribute("data-p")){state.stat.p=t.getAttribute("data-p");state.stat.o=0;save();renderStats();return;}
    if(t.hasAttribute("data-o")){state.stat.o+=+t.getAttribute("data-o");if(state.stat.o>0)state.stat.o=0;save();renderStats();}
  });

  /* ---------- Язык ---------- */
  var lb=document.querySelectorAll(".lang");
  for(var li=0;li<lb.length;li++){
    lb[li].onclick=function(){
      state.lang=this.getAttribute("data-lang");
      state.filter="";armed=false;save();renderAll();
    };
  }

  /* ---------- Синхронизация с Supabase ---------- */
  function saveSettings(){
    if(!sb||!uid||!state.order)return;
    clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){
      run(sb.from("settings").upsert({user_id:uid,lang:state.lang,tab_order:state.order},{onConflict:"user_id"})).catch(fail);
    },600);
  }
  function loadAll(){
    var since=shift(todayISO(),-400);
    return Promise.all([
      sb.from("tasks").select("*").order("created_at"),
      sb.from("notes").select("*").order("created_at"),
      sb.from("habits").select("*").order("created_at"),
      sb.from("habit_logs").select("habit_id,day").gte("day",since).limit(5000),
      sb.from("files").select("*").order("created_at"),
      sb.from("settings").select("*").maybeSingle()
    ]).then(function(r){
      r.forEach(ok);
      state.tasks=r[0].data.map(rowTask);
      state.notes={};
      r[1].data.forEach(function(n){(state.notes[n.course]=state.notes[n.course]||[]).push({id:n.id,text:n.body,ts:Date.parse(n.created_at)})});
      state.habits=r[2].data.map(function(h){return{id:h.id,name:h.name,icon:h.icon,color:h.color,createdAt:h.started_on}});
      state.log={};
      r[3].data.forEach(function(l){(state.log[l.habit_id]=state.log[l.habit_id]||{})[l.day]=1});
      state.files=r[4].data;
      var s=r[5].data;
      if(s&&I18N[s.lang])state.lang=s.lang;
      state.order=cleanOrder(s?s.tab_order:null);
    });
  }

  /* ---------- Перенос данных из этого браузера ---------- */
  var localPack=null;
  function localFiles(){
    return new Promise(function(res){
      try{
        var r=indexedDB.open("student-files",1);
        r.onupgradeneeded=function(){r.result.createObjectStore("files",{keyPath:"id"})};
        r.onsuccess=function(){
          try{
            var q=r.result.transaction("files","readonly").objectStore("files").getAll();
            q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])};
          }catch(e){res([])}
        };
        r.onerror=function(){res([])};
      }catch(e){res([])}
    });
  }
  function checkImport(){
    if(readKey(IMPORTED))return;
    var d=readKey(LOCALKEY)||readKey("student-todo-v2")||{};
    var tasks=(d.tasks||[]).filter(function(t){return !t.k});
    var habits=(d.habits||[]).filter(function(h){return !h.k});
    var notes=d.notes||{},nc=0;
    Object.keys(notes).forEach(function(c){nc+=(notes[c]||[]).length});
    localFiles().then(function(files){
      localPack={tasks:tasks,habits:habits,log:d.log||{},notes:notes,files:files};
      if(!tasks.length&&!habits.length&&!nc&&!files.length)return;
      var L=T();
      $("impTitle").textContent=L.importTitle;
      $("impCount").textContent=L.importCount.replace("{a}",tasks.length).replace("{b}",nc).replace("{c}",habits.length).replace("{d}",files.length);
      $("impGo").textContent=L.importBtn;$("impSkip").textContent=L.importSkip;
      $("importBanner").hidden=false;
    });
  }
  async function doImport(){
    var P=localPack;if(!P)return;
    $("impGo").disabled=true;
    try{
      if(P.tasks.length){
        ok(await sb.from("tasks").insert(P.tasks.map(function(t){return{title:t.title,subject:t.subject||"",due:t.due||null,prio:t.prio,done:!!t.done,done_at:t.doneAt||null}})));
      }
      var map={};
      for(var i=0;i<P.habits.length;i++){
        var h=P.habits[i];
        var r=ok(await sb.from("habits").insert({name:h.name,icon:h.icon,color:h.color,started_on:h.createdAt||todayISO()}).select().single());
        map[h.id]=r.data.id;
      }
      var lr=[];
      Object.keys(P.log).forEach(function(oid){
        if(!map[oid])return;
        Object.keys(P.log[oid]).forEach(function(d){lr.push({habit_id:map[oid],day:d})});
      });
      if(lr.length)ok(await sb.from("habit_logs").insert(lr));
      var nr=[];
      Object.keys(P.notes).forEach(function(c){
        (P.notes[c]||[]).forEach(function(n){nr.push({course:c,body:n.text,created_at:new Date(n.ts).toISOString()})});
      });
      if(nr.length)ok(await sb.from("notes").insert(nr));
      for(var j=0;j<P.files.length;j++){
        var f=P.files[j],path=uid+"/"+Date.now()+"_"+f.name.replace(/[^A-Za-z0-9._-]+/g,"_");
        ok(await sb.storage.from("files").upload(path,f.blob,{contentType:f.type||"application/octet-stream"}));
        ok(await sb.from("files").insert({course:f.course,name:f.name,mime:f.type,size:f.size,path:path}));
      }
      writeKey(IMPORTED,1);
      await loadAll();
      $("importBanner").hidden=true;
      renderAll();toast(T().importDone);
    }catch(err){fail(err)}
    $("impGo").disabled=false;
  }
  $("impGo").onclick=doImport;
  $("impSkip").onclick=function(){writeKey(IMPORTED,1);$("importBanner").hidden=true};

  /* ---------- Вход ---------- */
  function renderAuthTexts(){
    var L=T(),inMode=authMode==="in";
    $("aTitle").textContent=inMode?L.authIn:L.authUp;
    $("aSubmit").textContent=inMode?L.signIn:L.signUp;
    $("aToggle").textContent=inMode?L.noAcc:L.haveAcc;
    $("aPass").setAttribute("autocomplete",inMode?"current-password":"new-password");
  }
  function showAuth(msg){
    document.body.classList.remove("authed");
    $("loading").hidden=true;
    if(msg!=null)$("aMsg").textContent=msg;
    applyLang();
  }
  $("aToggle").onclick=function(){authMode=authMode==="in"?"up":"in";$("aMsg").textContent="";renderAuthTexts()};
  $("authForm").addEventListener("submit",function(e){
    e.preventDefault();
    if(!sb){$("aMsg").textContent=T().syncErr;return;}
    var email=$("aEmail").value.trim(),pass=$("aPass").value,L=T();
    $("aMsg").textContent="";$("aSubmit").disabled=true;
    var p=authMode==="in"?sb.auth.signInWithPassword({email:email,password:pass}):sb.auth.signUp({email:email,password:pass});
    p.then(function(r){
      if(r.error)throw r.error;
      if(authMode==="up"&&!r.data.session)$("aMsg").textContent=L.confirmMail;
    }).catch(function(err){
      $("aMsg").textContent=L.authErr+(err&&err.message?" ("+err.message+")":"");
    }).then(function(){$("aSubmit").disabled=false});
  });
  $("logoutBtn").onclick=function(){if(sb)sb.auth.signOut()};

  function boot(){
    $("loading").hidden=false;
    loadAll().then(function(){
      document.body.classList.add("authed");
      $("loading").hidden=true;
      showView(state.order[0]);
      checkImport();
    }).catch(function(err){
      if(window.console)console.error(err);
      showAuth(T().syncErr+(err&&err.message?" ("+err.message+")":""));
    });
  }

  function initSupabase(){
    if(!window.supabase||!window.supabase.createClient){showAuth(T().syncErr);return;}
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    sb.auth.onAuthStateChange(function(event,session){
      if(session&&session.user){
        if(uid!==session.user.id){uid=session.user.id;setTimeout(boot,0);}
      }else{
        uid=null;
        state.tasks=[];state.notes={};state.habits=[];state.log={};state.files=[];
        showAuth("");
      }
    });
  }

  applyLang();
  initSupabase();
})();
</script>
</body>
