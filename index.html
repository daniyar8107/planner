<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one centered column, summary on top, task groups by deadline below */
:root{
  --bg:#eef2f4;
  --surface:#ffffff;
  --ink:#16222a;
  --muted:#5d6d77;
  --line:#d9e1e5;
  --accent:#0f766e;
  --accent-ink:#ffffff;
  --danger:#c2410c;
  --font-display:"Unbounded","Onest",system-ui,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e171c;--surface:#16232a;--ink:#e6eef2;--muted:#93a5af;--line:#26353d;
    --accent:#2dd4bf;--accent-ink:#06211e;--danger:#fb923c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e171c;--surface:#16232a;--ink:#e6eef2;--muted:#93a5af;--line:#26353d;
  --accent:#2dd4bf;--accent-ink:#06211e;--danger:#fb923c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-family:var(--font-display);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.date{color:var(--muted);font-size:14px}
.langs{display:flex;gap:4px;flex:none}
.lang{min-width:44px;min-height:36px;padding:4px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.lang[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.summary-row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.summary-row b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
form .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select,button{font:inherit;color:inherit}
input[type=text],input[type=date],select{
  width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)
}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{min-height:44px;padding:9px 16px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{flex:none;min-height:36px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section.group{display:flex;flex-direction:column;gap:8px}
.group h2{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:baseline}
.group h2 span{font-variant-numeric:tabular-nums;font-weight:500}
.group.overdue h2{color:var(--danger)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li.task{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sub,var(--line));border-radius:12px;padding:10px 8px 10px 12px;display:flex;gap:12px;align-items:center}
li.task.p-high{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--danger) 55%,transparent)}
.check{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.check svg{width:16px;height:16px;opacity:0}
li.done .check{background:var(--accent);border-color:var(--accent)}
li.done .check svg{opacity:1;stroke:var(--accent-ink)}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.title{overflow-wrap:anywhere}
li.done .title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta .sub{color:var(--ink);font-weight:500}
.meta .late{color:var(--danger);font-weight:600}
.meta .hi{color:var(--danger);font-weight:600}
.del{flex:none;width:44px;height:44px;border:0;background:transparent;border-radius:10px;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
.del:hover{background:var(--bg);color:var(--danger)}
.empty{color:var(--muted);text-align:center;padding:28px 8px;border:1px dashed var(--line);border-radius:12px}
footer{color:var(--muted);font-size:12px;text-align:center}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;padding:6px}
.tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:12px}
.tab{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-weight:500;color:var(--muted)}
.tab[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
[hidden]{display:none!important}
#viewTasks,#viewSched{display:flex;flex-direction:column;gap:20px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day h2{margin:0;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:baseline}
.day h2 em{font-style:normal;font-size:12px;color:var(--accent);font-weight:600}
.cls{display:grid;grid-template-columns:92px 1fr;gap:10px;padding-top:8px;border-top:1px solid var(--line)}
.cls:first-of-type{border-top:0;padding-top:0}
.cls time{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;line-height:1.35}
.cls .cn{font-weight:500;overflow-wrap:anywhere}
.cls .cm{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
#viewSubj{display:flex;flex-direction:column;gap:16px}
.subjgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subjcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--sub);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:92px}
.subjcard:hover{border-color:var(--accent)}
.subjcard b{font-weight:600;overflow-wrap:anywhere}
.subjcard span{font-size:12px;color:var(--muted)}
.backbtn{align-self:flex-start;min-height:40px;padding:6px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.subjhead{display:flex;flex-direction:column;gap:2px;border-left:5px solid var(--sub);padding-left:12px}
.subjhead h2{margin:0;font-family:var(--font-display);font-size:18px;font-weight:600;text-wrap:balance}
.subjhead span{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel>h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
textarea{width:100%;min-height:84px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;resize:vertical}
textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{display:flex;flex-direction:column;gap:6px}
.note .nf{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.file{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.file:first-of-type{border-top:0}
.file .fn{flex:1;min-width:0;overflow-wrap:anywhere}
.file .fs{font-size:12px;color:var(--muted)}
.mini{min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.mini:hover{border-color:var(--accent)}
.none{color:var(--muted);font-size:14px}
.src{color:var(--muted);font-size:13px}
@media (max-width:420px){form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div>
        <h1 data-i="title"></h1>
        <div class="date" id="today"></div>
      </div>
      <div class="langs" role="group" aria-label="Language">
        <button class="lang" type="button" data-lang="ru">RU</button>
        <button class="lang" type="button" data-lang="ky">KY</button>
        <button class="lang" type="button" data-lang="tr">TR</button>
      </div>
    </div>
    <div class="summary" aria-live="polite">
      <div class="summary-row">
        <span><span data-i="sToday"></span>: <b id="sToday">0</b></span>
        <span><span data-i="sLate"></span>: <b id="sLate">0</b></span>
        <span><span data-i="sDone"></span>: <b id="sDone">0</b></span>
      </div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" id="tabTasks" role="tab" type="button" aria-selected="true" data-i="tabTasks"></button>
    <button class="tab" id="tabSched" role="tab" type="button" aria-selected="false" data-i="tabSched"></button>
    <button class="tab" id="tabSubj" role="tab" type="button" aria-selected="false" data-i="tabSubj"></button>
  </div>

  <div id="viewSubj" hidden></div>

  <div id="viewSched" hidden>
    <div id="schedList" style="display:flex;flex-direction:column;gap:12px"></div>
    <div class="src" data-i="source"></div>
  </div>

  <div id="viewTasks">
    <form id="form" autocomplete="off">
      <label class="full" for="fTitle"><span data-i="fWhat"></span>
        <input type="text" id="fTitle" data-ph="fWhatPh" required maxlength="200">
      </label>
      <label for="fSubject"><span data-i="fSubject"></span>
        <input type="text" id="fSubject" list="subjects" data-ph="fSubjectPh" maxlength="40">
        <datalist id="subjects"></datalist>
      </label>
      <label for="fDue"><span data-i="fDue"></span>
        <input type="date" id="fDue">
      </label>
      <label for="fPrio"><span data-i="fPrio"></span>
        <select id="fPrio">
          <option value="1" data-i="pNormal"></option>
          <option value="2" data-i="pHigh"></option>
          <option value="0" data-i="pLow"></option>
        </select>
      </label>
      <div style="display:flex;align-items:flex-end"><button class="btn" type="submit" style="width:100%" data-i="add"></button></div>
    </form>

    <div class="filters" id="filters" role="group"></div>

    <main id="list" style="display:flex;flex-direction:column;gap:20px"></main>

    <footer>
      <span data-i="footer"></span>
      <button class="linkbtn" id="reset" type="button"></button>
    </footer>
  </div>
</div>

      source:"Yönetim, Manas Üniversitesi. Veri: manas-timetable.vercel.app.",
      tabSubj:"Dersler",back:"← Geri",notesH:"Notlar",noteAdd:"Not ekle",notePh:"Notunuzu yazın…",noNotes:"Henüz not yok.",
      filesH:"Dosyalar",upload:"Dosya yükle",noFiles:"Henüz dosya yok.",open:"Aç",filesNote:"Dosyalar yalnızca bu tarayıcıda saklanır.",
      noIDB:"Dosya yükleme burada kullanılamıyor.",tooBig:"Dosya 25 MB'tan büyük.",errSave:"Dosya kaydedilemedi.",
      counts:"Not: {a} · Dosya: {b}",
      days:["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"],
      months:["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"],
      dateFmt:"{d} {m}",
      courses:{acc:"Genel Muhasebe I",eco:"İktisada Giriş I",math:"Matematik I",pe:"Beden Eğitimi ve Spor I",kgz:"Kırgız Dili ve Edebiyatı I",law:"Hukuka Giriş",biz:"İşletmeye Giriş"},
      room:{sport:"KSSB Spor sahası (kapalı)"},
      t:{ulan:"Ulanbek Moldokmatov",zey:"Zeynep Güldem Ökem",mir:"Mirbek Toktosunov",nil:"Nilufar Haydarova",cam:"Camila Bokoeva",med:"Mederbek Orolbaev",aza:"Azamat Maksudunov"},
      subj:{eco:"İktisat",math:"Matematik",hist:"Tarih",phys:"Fizik",eng:"İngilizce"},
      samples:{s1:"Mikroekonomi 4. bölümü oku",s2:"Analizden 10 soru çöz",s3:"Tarih referatı: plan ve kaynaklar",s4:"Fizik laboratuvarı: raporu hazırla",s5:"30 yeni kelime öğren"}
    }
  };
  var LANG_ATTR={ru:"ru",ky:"ky",tr:"tr"};

  function pad(n){return n<10?"0"+n:""+n}
  function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function addDays(n){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return iso(d)}
  function dayDiff(s){
    var a=new Date(s+"T12:00:00"),b=new Date();b.setHours(12,0,0,0);
    return Math.round((a-b)/86400000);
  }

  var state=load();
  if(!state){
    state={lang:"ru",filter:"",tasks:[
      {id:1,k:"s1",sk:"eco",title:"",subject:"",due:addDays(0),prio:1,done:false},
      {id:2,k:"s2",sk:"math",title:"",subject:"",due:addDays(1),prio:2,done:false},
      {id:3,k:"s3",sk:"hist",title:"",subject:"",due:addDays(5),prio:1,done:false},
      {id:4,k:"s4",sk:"phys",title:"",subject:"",due:addDays(-1),prio:2,done:false},
      {id:5,k:"s5",sk:"eng",title:"",subject:"",due:addDays(0),prio:0,done:true}
    ]};
    save();
  }
  if(!I18N[state.lang])state.lang="ru";
  function T(){return I18N[state.lang]}

  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
  function subColor(t){var key=t.sk||t.subject;return key?"hsl("+hue(key)+" 55% 48%)":"var(--line)"}
  function tTitle(t){return t.k?T().samples[t.k]:t.title}
  function tSubj(t){return t.sk?T().subj[t.sk]:t.subject}
  function fmtDate(s){
    var d=new Date(s+"T12:00:00");
    return T().dateFmt.replace("{d}",d.getDate()).replace("{m}",T().months[d.getMonth()]);
  }

  function dueLabel(t){
    var d=dayDiff(t.due),L=T(),date=fmtDate(t.due);
    if(t.done)return date;
    if(d<0)return '<span class="late">'+date+' · '+L.lateBy.replace("{n}",-d)+'</span>';
    if(d===0)return L.today;
    if(d===1)return L.tomorrow;
    return date;
  }

  function groupOf(t){
    if(t.done)return "done";
    if(!t.due)return "none";
    var d=dayDiff(t.due);
    if(d<0)return "overdue";
    if(d===0)return "today";
    if(d===1)return "tomorrow";
    if(d<=7)return "week";
    return "later";
  }
  var ORDER=["overdue","today","tomorrow","week","later","none","done"];

  function applyLang(){
    var L=T();
    document.documentElement.lang=LANG_ATTR[state.lang];
    var els=document.querySelectorAll("[data-i]");
    for(var i=0;i<els.length;i++)els[i].textContent=L[els[i].getAttribute("data-i")];
    var ph=document.querySelectorAll("[data-ph]");
    for(var j=0;j<ph.length;j++)ph[j].placeholder=L[ph[j].getAttribute("data-ph")];
    $("filters").setAttribute("aria-label",L.filterAria);
    $("reset").textContent=L.clear;
    var lb=document.querySelectorAll(".lang");
    for(var k=0;k<lb.length;k++)lb[k].setAttribute("aria-pressed",lb[k].getAttribute("data-lang")===state.lang?"true":"false");
    var now=new Date();
    $("today").textContent=L.days[now.getDay()]+", "+fmtDate(iso(now));
  }

  function render(){
    var L=T();
    applyLang();

    var subs=[];
    state.tasks.forEach(function(t){var s=tSubj(t);if(s&&subs.indexOf(s)<0)subs.push(s)});
    subs.sort();
    if(state.filter&&subs.indexOf(state.filter)<0)state.filter="";
    $("subjects").innerHTML=subs.map(function(s){return '<option value="'+esc(s)+'">'}).join("");

    var f=$("filters");
    f.innerHTML="";
    [""].concat(subs).forEach(function(s){
      var b=document.createElement("button");
      b.type="button";b.className="chip";
      b.textContent=s||L.all;
      b.setAttribute("aria-pressed",state.filter===s?"true":"false");
      b.onclick=function(){state.filter=s;save();render()};
      f.appendChild(b);
    });

    var shown=state.tasks.filter(function(t){return !state.filter||tSubj(t)===state.filter});

    var open=state.tasks.filter(function(t){return !t.done});
    $("sToday").textContent=open.filter(function(t){return t.due&&dayDiff(t.due)===0}).length;
    $("sLate").textContent=open.filter(function(t){return t.due&&dayDiff(t.due)<0}).length;
    var doneN=state.tasks.length-open.length;
    $("sDone").textContent=L.of.replace("{a}",doneN).replace("{b}",state.tasks.length);
    $("bar").style.width=(state.tasks.length?Math.round(doneN/state.tasks.length*100):0)+"%";

    var out="";
    ORDER.forEach(function(g){
      var items=shown.filter(function(t){return groupOf(t)===g});
      if(!items.length)return;
      items.sort(function(a,b){
        if(a.done!==b.done)return a.done?1:-1;
        if(a.due&&b.due&&a.due!==b.due)return a.due<b.due?-1:1;
        if(a.due!==b.due)return a.due?-1:1;
        return b.prio-a.prio;
      });
      out+='<section class="group '+g+'"><h2>'+esc(L.g[g])+'<span>'+items.length+'</span></h2><ul>';
      items.forEach(function(t){
        var title=tTitle(t),subj=tSubj(t);
        out+='<li class="task'+(t.done?" done":"")+(t.prio===2&&!t.done?" p-high":"")+'" style="--sub:'+subColor(t)+'">'+
          '<button class="check" type="button" data-act="toggle" data-id="'+t.id+'" role="checkbox" aria-checked="'+t.done+'" aria-label="'+esc(L.markDone+title)+'">'+
          '<svg viewBox="0 0 16 16" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg></button>'+
          '<div class="body"><div class="title">'+esc(title)+'</div><div class="meta">'+
          (subj?'<span class="sub">'+esc(subj)+'</span>':'')+
          (t.due?'<span>'+dueLabel(t)+'</span>':'')+
          (t.prio===2&&!t.done?'<span class="hi">'+esc(L.important)+'</span>':'')+
          '</div></div>'+
          '<button class="del" type="button" data-act="del" data-id="'+t.id+'" aria-label="'+esc(L.del+title)+'">×</button></li>';
      });
      out+='</ul></section>';
    });
    $("list").innerHTML=out||'<div class="empty">'+esc(L.empty)+'</div>';
    renderSched();
    renderSubj();
  }

  $("list").addEventListener("click",function(e){
    var el=e.target.closest("[data-act]");if(!el)return;
    var id=+el.getAttribute("data-id");
    if(el.getAttribute("data-act")==="toggle"){
      state.tasks.forEach(function(t){if(t.id===id)t.done=!t.done});
    }else{
      state.tasks=state.tasks.filter(function(t){return t.id!==id});
    }
    save();render();
  });

  $("form").addEventListener("submit",function(e){
    e.preventDefault();
    var title=$("fTitle").value.trim();
    if(!title)return;
    state.tasks.push({
      id:Date.now(),title:title,subject:$("fSubject").value.trim(),
      due:$("fDue").value,prio:+$("fPrio").value,done:false
    });
    $("fTitle").value="";$("fDue").value="";$("fPrio").value="1";
    save();render();$("fTitle").focus();
  });

  var armed=false;
  $("reset").addEventListener("click",function(){
    var b=$("reset");
    if(!armed){armed=true;b.textContent=T().confirm;setTimeout(function(){armed=false;b.textContent=T().clear},4000);return;}
    armed=false;b.textContent=T().clear;
    state.tasks=[];save();render();
  });

  /* ---------- Расписание: [день 1-5, начало, конец, курс, код, преподаватель, аудитория] ---------- */
  var SCHED=[
    [1,"08:00","10:35","acc","İSL-103.00","ulan","İİBF 326"],
    [1,"13:30","16:05","eco","EKN-101","zey","İİBF 128"],
    [2,"08:55","10:35","math","MAT-181","mir","İİBF 324"],
    [2,"13:30","15:10","pe","BES-111","nil","@sport"],
    [3,"10:45","12:25","math","MAT-181","mir","İİBF 324"],
    [3,"13:30","16:05","kgz","KGZ-103","cam","İİBF 321"],
    [4,"08:55","11:30","law","İSL-105","med","İİBF 323"],
    [4,"13:30","16:05","biz","İSL-101","aza","İİBF 127"]
  ];
  function renderSched(){
    var L=T(),td=new Date().getDay(),out="";
    for(var d=1;d<=5;d++){
      var rows=SCHED.filter(function(r){return r[0]===d}).sort(function(a,b){return a[1]<b[1]?-1:a[1]>b[1]?1:0});
      out+='<section class="day'+(td===d?" today":"")+'"><h2>'+esc(L.days[d])+(td===d?' <em>'+esc(L.todayBadge)+'</em>':'')+'</h2>';
      if(!rows.length)out+='<div class="none">'+esc(L.noClasses)+'</div>';
      rows.forEach(function(r){
        var room=r[6].charAt(0)==="@"?L.room[r[6].slice(1)]:r[6];
        out+='<div class="cls"><time>'+r[1]+'–'+r[2]+'</time><div><div class="cn">'+esc(L.courses[r[3]])+' ('+esc(r[4])+')</div><div class="cm">'+esc(L.t[r[5]])+' · '+esc(room)+'</div></div></div>';
      });
      out+='</section>';
    }
    $("schedList").innerHTML=out;
  }

  /* ---------- Предметы: заметки (localStorage) и файлы (IndexedDB) ---------- */
  var COURSES=["acc","eco","math","pe","kgz","law","biz"];
  var cur=null,view="tasks",fileCache=[];
  if(!state.notes)state.notes={};

  function openDB(){
    return new Promise(function(res,rej){
      try{
        var r=indexedDB.open("student-files",1);
        r.onupgradeneeded=function(){r.result.createObjectStore("files",{keyPath:"id"})};
        r.onsuccess=function(){res(r.result)};
        r.onerror=function(){rej(r.error)};
      }catch(e){rej(e)}
    });
  }
  function dbDo(mode,fn){
    return openDB().then(function(db){
      return new Promise(function(res,rej){
        var tx=db.transaction("files",mode),st=tx.objectStore("files"),req=fn(st);
        tx.oncomplete=function(){res(req&&req.result)};
        tx.onerror=tx.onabort=function(){rej(tx.error)};
      });
    });
  }
  function allFiles(){return dbDo("readonly",function(s){return s.getAll()}).then(function(r){return r||[]},function(){return null})}

  function fmtSize(b){return b<1048576?Math.max(1,Math.round(b/1024))+" KB":(b/1048576).toFixed(1)+" MB"}
  function courseColor(k){return "hsl("+hue(k)+" 55% 48%)"}

  function renderSubj(){
    var L=T(),box=$("viewSubj");
    if(view!=="subj")return;
    allFiles().then(function(files){
      fileCache=files;
      var out="";
      if(!cur){
        out='<div class="subjgrid">';
        COURSES.forEach(function(k){
          var n=(state.notes[k]||[]).length;
          var f=files?files.filter(function(x){return x.course===k}).length:0;
          out+='<button class="subjcard" type="button" data-course="'+k+'" style="--sub:'+courseColor(k)+'"><b>'+esc(L.courses[k])+'</b><span>'+esc(L.counts.replace("{a}",n).replace("{b}",f))+'</span></button>';
        });
        out+='</div>';
      }else{
        var notes=state.notes[cur]||[],mine=files?files.filter(function(x){return x.course===cur}):[];
        out='<button class="backbtn" type="button" id="subjBack">'+esc(L.back)+'</button>'+
          '<div class="subjhead" style="--sub:'+courseColor(cur)+'"><h2>'+esc(L.courses[cur])+'</h2></div>'+
          '<div class="panel"><h3>'+esc(L.notesH)+'</h3>'+
          '<textarea id="newNote" placeholder="'+esc(L.notePh)+'" aria-label="'+esc(L.noteAdd)+'"></textarea>'+
          '<button class="btn" type="button" id="noteAdd">'+esc(L.noteAdd)+'</button>';
        if(!notes.length)out+='<div class="none">'+esc(L.noNotes)+'</div>';
        notes.slice().sort(function(a,b){return b.ts-a.ts}).forEach(function(n){
          out+='<div class="note"><textarea data-nid="'+n.id+'" aria-label="'+esc(L.notesH)+'">'+esc(n.text)+'</textarea>'+
            '<div class="nf"><span>'+esc(fmtDate(iso(new Date(n.ts))))+'</span><button class="mini" type="button" data-ndel="'+n.id+'" aria-label="'+esc(L.del)+'">×</button></div></div>';
        });
        out+='</div><div class="panel"><h3>'+esc(L.filesH)+'</h3>';
        if(files===null){out+='<div class="none">'+esc(L.noIDB)+'</div>';}
        else{
          out+='<input type="file" id="fileIn" hidden accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,image/*">'+
            '<button class="btn" type="button" id="fileBtn">'+esc(L.upload)+'</button><div class="none" id="fileMsg"></div>';
          if(!mine.length)out+='<div class="none">'+esc(L.noFiles)+'</div>';
          mine.forEach(function(f){
            out+='<div class="file"><div class="fn">'+esc(f.name)+'<div class="fs">'+fmtSize(f.size)+'</div></div>'+
              '<button class="mini" type="button" data-fopen="'+f.id+'">'+esc(L.open)+'</button>'+
              '<button class="mini" type="button" data-fdel="'+f.id+'" aria-label="'+esc(L.del+f.name)+'">×</button></div>';
          });
          out+='<div class="src">'+esc(L.filesNote)+'</div>';
        }
        out+='</div>';
      }
      box.innerHTML=out;
    });
  }

  $("viewSubj").addEventListener("click",function(e){
    var L=T(),t=e.target.closest("button");if(!t)return;
    if(t.hasAttribute("data-course")){cur=t.getAttribute("data-course");renderSubj();window.scrollTo(0,0);return;}
    if(t.id==="subjBack"){cur=null;renderSubj();return;}
    if(t.id==="noteAdd"){
      var ta=$("newNote"),v=ta.value.trim();if(!v)return;
      (state.notes[cur]=state.notes[cur]||[]).push({id:Date.now(),text:v,ts:Date.now()});
      save();renderSubj();return;
    }
    if(t.hasAttribute("data-ndel")){
      var id=+t.getAttribute("data-ndel");
      state.notes[cur]=(state.notes[cur]||[]).filter(function(n){return n.id!==id});
      save();renderSubj();return;
    }
    if(t.id==="fileBtn"){$("fileIn").click();return;}
    if(t.hasAttribute("data-fopen")){
      var fid=+t.getAttribute("data-fopen"),rec=fileCache.filter(function(x){return x.id===fid})[0];
      if(!rec)return;
      var url=URL.createObjectURL(rec.blob),a=document.createElement("a");
      a.href=url;a.target="_blank";a.rel="noopener";a.download="";
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},60000);return;
    }
    if(t.hasAttribute("data-fdel")){
      var did=+t.getAttribute("data-fdel");
      dbDo("readwrite",function(s){return s.delete(did)}).then(renderSubj,renderSubj);
    }
  });
  $("viewSubj").addEventListener("change",function(e){
    var t=e.target;
    if(t.hasAttribute("data-nid")){
      var id=+t.getAttribute("data-nid");
      (state.notes[cur]||[]).forEach(function(n){if(n.id===id)n.text=t.value});
      save();return;
    }
    if(t.id==="fileIn"&&t.files&&t.files[0]){
      var f=t.files[0],L=T();
      if(f.size>25*1048576){$("fileMsg").textContent=L.tooBig;t.value="";return;}
      var rec={id:Date.now(),course:cur,name:f.name,type:f.type,size:f.size,blob:f};
      dbDo("readwrite",function(s){return s.put(rec)}).then(renderSubj,function(){$("fileMsg").textContent=L.errSave});
    }
  });

  function showTab(name){
    view=name;
    $("viewTasks").hidden=name!=="tasks";
    $("viewSched").hidden=name!=="sched";
    $("viewSubj").hidden=name!=="subj";
    $("tabTasks").setAttribute("aria-selected",name==="tasks"?"true":"false");
    $("tabSched").setAttribute("aria-selected",name==="sched"?"true":"false");
    $("tabSubj").setAttribute("aria-selected",name==="subj"?"true":"false");
    if(name==="subj"){cur=null;renderSubj();}
  }
  $("tabTasks").onclick=function(){showTab("tasks")};
  $("tabSched").onclick=function(){showTab("sched")};
  $("tabSubj").onclick=function(){showTab("subj")};

  var lb=document.querySelectorAll(".lang");
  for(var i=0;i<lb.length;i++){
    lb[i].onclick=function(){
      state.lang=this.getAttribute("data-lang");
      state.filter="";armed=false;save();render();
    };
  }

  render();
})();
</script>
</body>
</html>
